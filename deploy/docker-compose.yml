# Uruchomienie: z katalogu głównego projektu
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Architektura: Internet -> Cloudflare (DDoS/WAF/HTTPS) -> Cloudflare Tunnel -> aplikacja
# Serwer nie ma otwartych portów HTTP — jego adres IP nie jest publicznie powiązany ze sklepem.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      TRUST_PROXY: "1"
    volumes:
      - ../data:/app/data
    # Port wystawiony wyłącznie na localhost (do diagnostyki). NIE zmieniaj na 0.0.0.0.
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 512M

  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Token tunelu z panelu Cloudflare Zero Trust (Networks -> Tunnels). Wpisz go w pliku .env
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
